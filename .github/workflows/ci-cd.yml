name: Cypress Tests, Postman API Tests, and K6 Performance Tests

on:
  workflow_dispatch:
  
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Sync Postman Collection (only on main push)
      - name: Sync Postman Collection
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p cypress/e2e/api-tests
          curl -X GET "https://api.getpostman.com/collections/${{ secrets.POSTMAN_COLLECTION_ID }}" \
          -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" \
          -o cypress/e2e/api-tests/postman_collection.json

      # Commit only if changes exist (prevents failure + loop control)
      - name: Commit updated Postman collection
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [[ -n "$(git status --porcelain cypress/e2e/api-tests/postman_collection.json)" ]]; then
            git add cypress/e2e/api-tests/postman_collection.json
            git commit -m "chore: auto-sync Postman collection"
            git push
          else
            echo "No changes in Postman collection"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.18.0'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npm run cy:run

      - name: Run Postman API tests
        run: npm run postman:run

      - name: Setup K6
        uses: grafana/setup-k6-action@v1
        
      - name: Run k6 test - workflow
        run: npm run k6:run-workflow
      
      - name: Upload k6 results artifact
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: cypress/e2e/performance-tests/k6/reports/k6-workflow-summary.csv
      
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: k6-html-report
          path: cypress/e2e/performance-tests/k6/reports/k6-workflow-summary.html

      - name: Run k6 test - endpoints
        run: npm run k6:run-endpoint
      
      - name: Upload k6 results artifact
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: cypress/e2e/performance-tests/k6/reports/k6-endpoint-summary.csv
      
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: k6-html-report
          path: cypress/e2e/performance-tests/k6/reports/k6-endpoint-summary.html

