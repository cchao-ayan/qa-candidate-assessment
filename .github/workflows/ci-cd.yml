name: QA Pipeline (Cypress + Postman + k6)

on:
  workflow_dispatch:
  
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  QA_Pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Set version
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          VERSION=${GITHUB_REF_NAME}-${{ github.run_number }}-$SHORT_SHA
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.18.0'

      - name: Install dependencies
        run: npm ci

      # Sync Postman Collection (only on main push)
      - name: Sync Postman Collection
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p cypress/e2e/api-tests
          curl -X GET "https://api.getpostman.com/collections/${{ secrets.POSTMAN_COLLECTION_ID }}" \
          -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" \
          -o cypress/e2e/api-tests/postman_collection.json

      # Commit only if changes exist (prevents failure + loop control)
      - name: Commit updated Postman collection
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if [[ -n "$(git status --porcelain cypress/e2e/api-tests/postman_collection.json)" ]]; then
            git add cypress/e2e/api-tests/postman_collection.json
            git commit -m "chore: auto-sync Postman collection"
            git push
          else
            echo "No changes in Postman collection"
          fi

      # Cypress (non-blocking but visible failure)
      - name: Run Cypress tests
        id: cypress
        continue-on-error: true
        run: npm run cy:run

       # Postman (non-blocking but visible failure)
      - name: Run Postman API tests
        id: postman
        continue-on-error: true
        run: npm run postman:run

      # Setup k6
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # k6 Workflow
      - name: Run k6 test - workflow
        id: k6_workflow
        continue-on-error: true
        run: VERSION=${VERSION} npm run k6:run-workflow

      # k6 Endpoints
      - name: Run k6 test - endpoints
        id: k6_endpoints
        continue-on-error: true
        run: VERSION=${VERSION} npm run k6:run-endpoints

      # Organize reports
      - name: Rename reports
        run: |
          mkdir -p cypress/e2e/performance-tests/k6/reports/${VERSION}

          mv cypress/e2e/performance-tests/k6/reports/k6-workflow-summary.html \
             cypress/e2e/performance-tests/k6/reports/${VERSION}/k6-workflow-${VERSION}.html || true

          mv cypress/e2e/performance-tests/k6/reports/k6-endpoints-summary.html \
             cypress/e2e/performance-tests/k6/reports/${VERSION}/k6-endpoints-${VERSION}.html || true

      # Upload reports
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ env.VERSION }}
          path: cypress/e2e/performance-tests/k6/reports/${{ env.VERSION }}

      # Final check to determine overall workflow status
      - name: Final Status Check
        if: always()
        run: |
          echo "Cypress result: ${{ steps.cypress.outcome }}"
          echo "Postman result: ${{ steps.postman.outcome }}"
          echo "k6 workflow result: ${{ steps.k6_workflow.outcome }}"
          echo "k6 endpoints result: ${{ steps.k6_endpoints.outcome }}"

          if [[ "${{ steps.cypress.outcome }}" == "failure" || \
                "${{ steps.postman.outcome }}" == "failure" || \
                "${{ steps.k6_workflow.outcome }}" == "failure" || \
                "${{ steps.k6_endpoints.outcome }}" == "failure" ]]; then
            echo "❌ One or more test stages failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi

